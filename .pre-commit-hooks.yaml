# Hooks for the pre-commit framework (https://pre-commit.com).
#
# Two of them, and the difference between them is the only thing that matters:
# the first never touches the network, the second does, and you have to ask for
# the second by name.
#
# Both pin the published package as an explicit dependency rather than relying
# on the checked-out revision building itself: `dist/` is not in git, so a git
# checkout has no executable until something builds one, and a hook that half
# installs is worse than one that names what it needs.

- id: snifftest
  name: Sniff Test
  description: Check staged prose against your house rules. Countable rules only; nothing leaves your machine.
  entry: snifftest check --dry-run
  language: node
  additional_dependencies: ["snifftest@0.1.0"]
  types_or: [markdown, plain-text]

- id: snifftest-send
  name: Sniff Test, with the judgment rules
  description: >-
    Also runs the rules that need reading, which sends the text to TypeSafe.
    Needs TYPESAFE_API_KEY and SNIFFTEST_SEND=1 in your environment. Listed
    under the manual stage so it never runs on a commit you did not ask it to.
  entry: snifftest check
  language: node
  additional_dependencies: ["snifftest@0.1.0"]
  types_or: [markdown, plain-text]
  stages: [manual]
