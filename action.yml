name: Sniff Test
description: Check prose against your house rules. Free rules only unless you opt in, and nothing leaves the runner on a fork's pull request.
author: Daniel Willoughby

branding:
  icon: wind
  color: purple

# The caller decides what this Action may touch. Nothing here needs a token, so
# the recommended workflow grants none at all:
#
#   permissions: {}
#
# Add `pull-requests: write` only if you also set `comment: true`, and pass the
# token in yourself; this Action never reaches for one.

inputs:
  paths:
    description: Files or directories to check, space separated.
    required: false
    default: "."
  rules:
    description: A ruleset to use instead of .snifftest.yaml or the built-in one.
    required: false
    default: ""
  threshold:
    description: The probability at or above which a judgment rule counts as a flag.
    required: false
    default: ""
  version:
    description: The exact version of the checker to run. An exact version, never a floating tag.
    required: false
    default: "0.1.0"
  send:
    description: Run the judgment rules, which sends the text to TypeSafe. Needs a key. Forced off for a pull request from a fork.
    required: false
    default: "false"
  api-key:
    description: A TYPESAFE_API_KEY, passed in by the caller. Read from nowhere else.
    required: false
    default: ""
  comment:
    description: Post the flags as a pull request comment. Off by default.
    required: false
    default: "false"
  github-token:
    description: A token with pull-requests write, used only when comment is on.
    required: false
    default: ""

outputs:
  exit-code:
    description: 0 nothing tripped, 1 at least one flag, 2 the checker could not finish.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path on the runner to the checker's output.
    value: ${{ steps.run.outputs.report }}
  verdict:
    description: findings, clean, failure or consent. What the exit code means, in a word.
    value: ${{ steps.run.outputs.verdict }}

runs:
  using: composite
  steps:
    - id: guard
      name: Decide what may leave the runner
      shell: bash
      env:
        SNIFFTEST_SEND_INPUT: ${{ inputs.send }}
        SNIFFTEST_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        # Whether a key was passed, never the key: it has no business being in
        # this step's environment, and one copy of it is one place to leak from.
        SNIFFTEST_HAS_KEY: ${{ inputs.api-key != '' }}
        SNIFFTEST_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Refuse any event whose name ends in _target. Those run in the base
        # repository's context, with its secret store and a writable token,
        # against a branch the pull request's author controls. Written as a
        # suffix match so the event's literal name stays out of this repository
        # and nobody copies it out of here into a workflow.
        case "${GITHUB_EVENT_NAME:-}" in
          *_target)
            echo "::error::Sniff Test will not run on a ${GITHUB_EVENT_NAME} event. Use pull_request."
            exit 1
            ;;
        esac

        case "$SNIFFTEST_VERSION" in
          latest|"" )
            echo "::error::version must be an exact version like 0.1.0, never a floating tag."
            exit 1
            ;;
        esac

        send="$SNIFFTEST_SEND_INPUT"

        # The fork test below reads a field that only a pull-request-shaped
        # event has, so on any other event it is empty and decides nothing. An
        # event this Action has not been reasoned about is therefore an event
        # whose fork guard is not running, and the honest answer to that is the
        # free rules rather than a guess. A comment event, for one, runs in the
        # base repository's context with its secrets and does not end in
        # _target, so the refusal above does not cover it either.
        case "${GITHUB_EVENT_NAME:-}" in
          pull_request | push | workflow_dispatch | schedule | merge_group) ;;
          *)
            echo "::notice::Sniff Test has no fork guard for a ${GITHUB_EVENT_NAME:-nameless} event: countable rules only."
            send=false
            ;;
        esac

        # A pull request from a fork is somebody else's branch running against
        # our workflow. It gets the free rules, whatever the caller asked for.
        if [ "${SNIFFTEST_IS_FORK:-}" = "true" ]; then
          echo "::notice::Pull request from a fork: countable rules only. Nothing leaves the runner."
          send=false
        fi

        if [ "$send" = "true" ] && [ "$SNIFFTEST_HAS_KEY" != "true" ]; then
          echo "::error::send is on but api-key is empty. Pass your TYPESAFE_API_KEY in. Nothing was sent."
          exit 1
        fi

        echo "send=$send" >> "$GITHUB_OUTPUT"

    - id: run
      name: Sniff Test
      shell: bash
      env:
        SNIFFTEST_VERSION: ${{ inputs.version }}
        SNIFFTEST_PATHS: ${{ inputs.paths }}
        SNIFFTEST_RULES: ${{ inputs.rules }}
        SNIFFTEST_THRESHOLD: ${{ inputs.threshold }}
        SNIFFTEST_SEND: ${{ steps.guard.outputs.send == 'true' && '1' || '0' }}
        # Only when something may actually be sent. A key in the environment of
        # the step that runs a checker over a fork's own files is a key with
        # nothing to do and somewhere to go.
        TYPESAFE_API_KEY: ${{ steps.guard.outputs.send == 'true' && inputs.api-key || '' }}
      run: |
        set -uo pipefail

        args=(check)
        [ "$SNIFFTEST_SEND" = "1" ] || args+=(--dry-run)
        [ -z "$SNIFFTEST_RULES" ] || args+=(--rules "$SNIFFTEST_RULES")
        [ -z "$SNIFFTEST_THRESHOLD" ] || args+=(--threshold "$SNIFFTEST_THRESHOLD")

        # The tree being checked, named rather than stood in. Relative paths and
        # the project's own ruleset are found here.
        args+=(--root "$GITHUB_WORKSPACE")

        report="${RUNNER_TEMP:-/tmp}/snifftest-report.txt"

        # The fetch is made from a scratch directory, never from the checkout.
        # `npx --yes snifftest@<version>` run inside a repository resolves that
        # repository's own node_modules/snifftest and never reaches a registry,
        # so on a pull request from a fork it would run the fork's code here,
        # with this environment. Measured offline, with the registry pointed at
        # a dead port: standing inside such a checkout ran the committed binary;
        # standing outside it refused to connect and ran nothing.
        fetch="${RUNNER_TEMP:-/tmp}/snifftest-fetch"
        mkdir -p "$fetch"
        cd "$fetch"

        status=0
        # shellcheck disable=SC2086 -- paths are space separated on purpose.
        npx --yes "snifftest@${SNIFFTEST_VERSION}" "${args[@]}" -- $SNIFFTEST_PATHS \
          > "$report" 2>&1 || status=$?

        cat "$report"

        # What the exit code means, in a word, because three of the four codes
        # are not about the prose at all. A checker that could not finish, or a
        # run nobody answered the sending question for, reported under a
        # sentence about the writing is a false accusation the writer cannot
        # argue with. Every surface below chooses its wording from this.
        case "$status" in
          0) verdict=clean ;;
          1) verdict=findings ;;
          3) verdict=consent ;;
          *) verdict=failure ;;
        esac

        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

        case "$verdict" in
          clean)
            echo "### Sniff Test: nothing tripped" >> "$GITHUB_STEP_SUMMARY"
            ;;
          findings)
            heading="### Sniff Test: the prose trips the rules below"
            ;;
          consent)
            heading="### Sniff Test: the judgment rules were not run"
            ;;
          *)
            heading="### Sniff Test: the checker could not finish. This is the tool, not the prose."
            ;;
        esac

        if [ "$verdict" != "clean" ]; then
          {
            echo "$heading"
            echo ""
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - id: comment
      name: Post the flags on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' && steps.run.outputs.exit-code != '0' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SNIFFTEST_REPORT: ${{ steps.run.outputs.report }}
        SNIFFTEST_VERDICT: ${{ steps.run.outputs.verdict }}
        SNIFFTEST_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # What travels is the checker's own output: file, line, rule id,
        # probability, and the message the ruleset wrote. No sentence of the
        # draft is ever read out of the file and into a comment, which is the
        # whole reason this step posts a report rather than a diff.
        #
        # The opening line is chosen by what actually happened. Posting "flagged
        # the prose" over a 401, a timeout or an unanswered sending question
        # tells an author their writing was judged when it never was.
        case "${SNIFFTEST_VERDICT:-failure}" in
          findings)
            opening="**Sniff Test** flagged the prose in this pull request."
            ;;
          consent)
            opening="**Sniff Test** did not run the judgment rules: nothing was sent, because the sending question was not answered. Nothing below is a judgment on the prose."
            ;;
          *)
            opening="**Sniff Test** could not finish. This is the checker failing, not a finding about the prose."
            ;;
        esac

        body="${RUNNER_TEMP:-/tmp}/snifftest-comment.md"
        {
          echo "$opening"
          echo ""
          echo '```'
          head -c 60000 "$SNIFFTEST_REPORT"
          echo '```'
        } > "$body"

        gh pr comment "$SNIFFTEST_PR" --body-file "$body"

    - id: verdict
      name: Report the verdict
      shell: bash
      env:
        SNIFFTEST_STATUS: ${{ steps.run.outputs.exit-code }}
      run: |
        set -euo pipefail
        exit "$SNIFFTEST_STATUS"
