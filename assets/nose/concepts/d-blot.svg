<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Sniff Test nose">
  <title>Sniff Test nose, concept D: Blot</title>
  <!--
    Hand-authored. A solid ink silhouette; the nostril, the far wing, the wing
    crease and the wrinkles are knock-outs (a mask), so they stay ground-coloured
    on any ground. The knock-out parts live inside the mask and still carry
    id + data-part, so the same manifest transforms apply to them.
  -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <g stroke="#000" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="nostril-r" data-part="nostril-r">
          <path fill="#000" stroke="none" d="M56 74c-5-1.5-10 1.5-8.5 5.5 1.2 3 6 3 8 0.5 1.4-1.8 1.4-4.2 0.5-6z"/>
          <path stroke-width="2.2" d="M46 83c8-1.5 15-7 16-15 0.3-2.4-0.4-4.6-1.8-6.4"/>
        </g>
        <g id="nostril-l" data-part="nostril-l">
          <path stroke-width="2.2" d="M17 72c-3 1.2-3.5 5-1 7.5"/>
        </g>
        <g id="wrinkle" data-part="wrinkle" opacity="0" stroke-width="2.2">
          <path d="M50 21l8-3.5"/>
          <path d="M48 28l8.5-3"/>
          <path d="M45.5 35l8-2.5"/>
        </g>
      </g>
    </mask>
  </defs>
  <g id="stage" data-part="stage" stroke-linecap="round" stroke-linejoin="round">
    <g id="nose" data-part="nose" fill="currentColor" stroke="none" mask="url(#cut)">
      <g id="bridge" data-part="bridge">
        <path d="M58 6c-4 6-8 14-11 21-2 5-4 9-6 13l11 5c2-4 4-8 6-13 2.5-6 5-12 6-18 0.3-2.4 0.4-5-0.5-8z"/>
      </g>
      <g id="tip" data-part="tip">
        <path d="M40 39c-8 6-20 15-24 27-3 9 2 18 12 20 8 1.5 16-1 22-6 4-3 7-7 7-12 0-6-2-12-5-17-3-5-8-8-12-12z"/>
        <path d="M60 55c5 0 9 4 9 9s-4 9-9 9-9-4-9-9 4-9 9-9z"/>
      </g>
    </g>
    <g id="scent" data-part="scent" fill="none" stroke="var(--nose-accent, #e4572e)" stroke-width="2.6" opacity="0">
      <path d="M4 96c4-6-4-12 1-18 4-6-3-12 2-18"/>
      <path d="M11 100c4-6-4-12 1-18 4-6-3-12 2-18"/>
      <path d="M18 100c4-5-3-9 1-14"/>
    </g>
    <g id="stink" data-part="stink" fill="none" stroke="var(--nose-accent, #e4572e)" stroke-width="2.6" opacity="0">
      <path d="M4 96l4-7-4-7 4-7-4-7 4-7"/>
      <path d="M12 100l4-7-4-7 4-7-4-7 4-7"/>
      <path d="M20 98l3-6-3-6 3-6"/>
    </g>
    <g id="marks" data-part="marks" fill="none" stroke="var(--nose-accent, #e4572e)" stroke-width="2.8">
      <g id="mark-ok" data-part="mark-ok" opacity="0">
        <path d="M14 30v11"/><path d="M8.5 35.5h11"/>
        <path d="M25 20v6"/><path d="M22 23h6"/>
      </g>
      <g id="mark-flick" data-part="mark-flick" opacity="0">
        <path d="M68 12l7-3"/><path d="M70 20l8-1"/>
      </g>
    </g>
  </g>
</svg>
