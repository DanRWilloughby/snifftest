name: Release

# A tag is the only thing that publishes. Nothing about a branch, a merge or a
# manual click puts a version on npm.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  publish:
    name: Publish to npm, then cut the release
    runs-on: ubuntu-latest

    # The gate. The npm token lives on this environment, not on the repository,
    # so a workflow that is not this one cannot reach it, and a required
    # reviewer on the environment means a tag alone never publishes unattended.
    environment:
      name: release
      url: https://www.npmjs.com/package/snifftest

    permissions:
      # Creating the GitHub Release.
      contents: write
      # The OIDC token npm signs the provenance attestation with. This is what
      # lets anyone check that this tarball was built by this workflow from this
      # commit, rather than uploaded by whoever held a token.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install, exactly as the lockfile says
        run: bun install --frozen-lockfile

      - name: Typecheck and tests
        run: bun run check

      - name: Build the published bin
        run: bun run build

      - name: The tag, package.json and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          packaged="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$packaged" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${packaged}."
            exit 1
          fi
          # The release notes are a slice of CHANGELOG.md: the section whose
          # heading names this version, up to the next version heading. A tag
          # with no section fails here rather than shipping empty notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## \[/  { exit }
            collecting              { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          cat release-notes.md

      - name: The package carries only what the allowlist names
        # Before the publish, because this is the workflow that ships. CI runs
        # the same script on the same allowlist; a release that skipped it would
        # be the one tarball nobody checked.
        run: |
          set -euo pipefail
          # --ignore-scripts: the bin is built by the step above, and a
          # lifecycle script's own output on stdout would not be JSON.
          npm pack --dry-run --ignore-scripts --json > pack.json
          node .github/scripts/tarball-allowlist.mjs pack.json
          rm -f pack.json

      - name: The tarball about to be published actually runs
        # The last thing before the publish, because a version that prints
        # nothing and exits 0 cannot be unpublished from anybody's CI. This
        # installs what is about to ship and runs it through the symbolic link
        # a package manager writes, which is the path every user takes.
        run: |
          set -euo pipefail
          npm pack --silent > packed.txt
          tarball="$(tail -n 1 packed.txt)"
          smoke="$(mktemp -d)"
          npm install --silent --prefix "$smoke" "./${tarball}"
          bin="$smoke/node_modules/.bin/snifftest"

          test -n "$("$bin" --version)"
          printf 'A sentence with a long dash \xe2\x80\x94 in the middle of it, and enough other words after it to read as a paragraph.\n' > "$smoke/draft.md"
          status=0
          "$bin" check --dry-run -- "$smoke/draft.md" > "$smoke/out.txt" 2>&1 || status=$?
          cat "$smoke/out.txt"
          if [ "$status" != "1" ]; then
            echo "::error::the packed bin exited $status on prose that trips a rule; nothing was published."
            exit 1
          fi

          rm -rf "$smoke" "$tarball" packed.txt

      - name: Is this version already on npm?
        # 0.1.0 was published by hand before the repo went public, and a tag
        # re-pushed after a partial run must never publish twice. The registry
        # is the source of truth: a version that is already there skips the
        # publish and still cuts the release, instead of failing the run.
        id: registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          found="$(npm view "snifftest@${version}" version 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "snifftest@${version} is already on npm; the publish step is skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Cut the GitHub Release
        env:
          # The job's own short-lived token, not a stored secret.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md)
          # The launch GIF rides along when there is one. Track C writes it;
          # until then the release is notes only rather than a broken upload.
          if [ -f assets/snifftest.gif ]; then
            args+=(assets/snifftest.gif#"Sniff Test in motion")
          fi
          gh "${args[@]}"
