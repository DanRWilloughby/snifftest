name: CI

# Only the two events that run in the pull request's own context. An event whose
# name ends in _target runs in the base repository's context, with its secret
# store and a writable token, against a branch the author of the pull request
# controls. This repository never uses one, and a test asserts it.
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow reads a secret and nothing it runs sends a byte to
# anyone: the checker runs with --dry-run, which is the countable rules only.
# Default to no permissions at all and let each job ask for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"

      - name: Install, exactly as the lockfile says
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Build the published bin
        run: bun run build

      - name: Nothing runtime is installed
        # The promise on the first screen of the README. `bun pm ls` prints the
        # installed tree; if a runtime dependency ever appears in package.json,
        # this is where it gets caught rather than in somebody's node_modules.
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const runtime = Object.keys(pkg.dependencies ?? {});
            if (runtime.length > 0) {
              console.error("Runtime dependencies are not allowed: " + runtime.join(", "));
              process.exit(1);
            }
            console.log("No runtime dependencies.");
          '
          bun pm ls

      - name: The packed tarball works when it is installed
        # Not "does it build" and not "does it parse": does the executable a
        # user reaches actually run. Everything a user reaches goes through the
        # symbolic link a package manager writes into node_modules/.bin, and a
        # bin that ends without running prints nothing and exits 0, which is
        # this tool's word for "nothing tripped". A dead release would look
        # exactly like a clean draft on every surface, so the tarball is
        # installed here and run through that link before anything ships.
        run: |
          set -euo pipefail
          npm pack --silent > packed.txt
          tarball="$(tail -n 1 packed.txt)"
          smoke="$(mktemp -d)"
          npm install --silent --prefix "$smoke" "./${tarball}"
          bin="$smoke/node_modules/.bin/snifftest"
          test -L "$bin"

          version="$("$bin" --version)"
          test -n "$version"
          echo "the installed bin reports $version"

          printf 'A sentence with a long dash \xe2\x80\x94 in the middle of it, and enough other words after it to read as a paragraph.\n' > "$smoke/draft.md"
          status=0
          "$bin" check --dry-run -- "$smoke/draft.md" > "$smoke/out.txt" 2>&1 || status=$?
          cat "$smoke/out.txt"
          if [ "$status" != "1" ]; then
            echo "::error::the installed bin exited $status on prose that trips a rule; 1 was expected."
            exit 1
          fi
          grep -q "dash_present" "$smoke/out.txt"

          rm -rf "$smoke" "$tarball" packed.txt

      - name: The package carries only what the allowlist names
        # The allowlist and its reasons live in one file, shared with the
        # release workflow, because the last time `files` was widened this gate
        # was left red instead of answered.
        run: |
          set -euo pipefail
          # --ignore-scripts: the bin is built by the step above, and a
          # lifecycle script's own output on stdout would not be JSON.
          npm pack --dry-run --ignore-scripts --json > pack.json
          node .github/scripts/tarball-allowlist.mjs pack.json
          rm -f pack.json

      - name: No tracked file is larger than the cap
        # Raw bench output is meant to be committed beside the numbers it
        # produced; a multi-megabyte dump of model responses is not. The cap
        # catches the second without banning the first.
        env:
          MAX_TRACKED_BYTES: "1048576"
        run: |
          set -euo pipefail
          oversized=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$MAX_TRACKED_BYTES" ]; then
              echo "::error file=${file}::${size} bytes, over the ${MAX_TRACKED_BYTES} byte cap. Summarise it, or store it outside the repository."
              oversized=1
            fi
          done < <(git ls-files -z)
          [ "$oversized" = "0" ]

      - name: Sniff Test reads its own prose
        # Dry run: the countable rules only, no key, nothing sent.
        #
        # Every tracked Markdown file, so a rule that misfires on a table or on
        # front matter is caught here rather than by a stranger. The corpus and
        # the fixtures are left out: both hold defects on purpose.
        run: |
          git ls-files '*.md' \
            | grep -v '^examples/' \
            | grep -v '^tests/fixtures/' \
            | xargs bun src/bin.ts check --dry-run

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history, not just the tip: a key removed in a later commit is
          # still a published key.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks, pinned and checksummed
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          rm -f "$archive"
          ./gitleaks version

      - name: Scan the whole history
        # --redact so a finding names the file and the rule without printing the
        # value into a public log, which would publish the very thing it caught.
        run: ./gitleaks git . --redact --no-banner --exit-code 1

      - name: Scan the working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # A package with zero runtime dependencies can afford the strictest
          # setting there is.
          fail-on-severity: low
